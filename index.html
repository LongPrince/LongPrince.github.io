    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://longprince.github.io/">
    <meta name="twitter:title" content="🎓 Thư mời tham dự Lễ Tốt Nghiệp - Đặng Văn Long">
    <meta name="twitter:description" content="Trân trọng kính mời bạn đến chung vui tại Lễ Tốt Nghiệp 8h30 - 11h, Thứ 7 ngày 11/07 tại Nhà hát Sông Hương - Học Viện Âm Nhạc Huế 🌸">
    <meta name="twitter:image" content="https://longprince.github.io/asset/Webp/Brown%20Neutral%20Collage%20Family%20Photo%20Collage%20(12).webp">

    <!-- SEO -->
    <meta name="description" content="Trân trọng kính mời bạn đến chung vui tại Lễ Tốt Nghiệp 8h30 - 11h, Thứ 7 ngày 11/07 tại Nhà hát Sông Hương - Học Viện Âm Nhạc Huế 🌸">

    <!-- Nhúng CSS phong cách cổ điển -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Lớp phủ chuyển trang mượt mà -->
    <div class="transition-overlay" id="overlay"></div>

    <div class="main-container">
        <!-- Dấu mộc bưu điện -->
        <img src="asset/Webp/postage mark_vector.webp" alt="Postage Stamp" class="postage-stamp">

        <!-- Container Phong bì -->
        <div class="envelope-container" id="envelope">
            <!-- Ảnh phong bì đóng/mở -->
            <img src="asset/Webp/letter_close.webp" alt="Envelope" class="envelope-img" id="envelope-img">

            <!-- Vệt màu nền cọ quét -->
            <div class="brush-stroke"></div>

            <!-- Cành hoa khô đè lên -->
            <img src="asset/Webp/mxpulqr9fk7tmteja9y8.webp" alt="Dried Flower Decor" class="flower-on-envelope"
                id="flower-decor">

            <!-- Băng keo dán trang trí -->
            <div class="washi-tape-green"></div>
            <div class="washi-tape-beige"></div>
        </div>

        <!-- Dòng chữ gợi ý mở thư -->
        <div class="action-text" id="action-text">Nhấn vào để mở thư</div>
    </div>

    <!-- Nhạc nền chạy ngầm -->
    <audio id="bg-audio" src="asset/Music/intro_nhacke.ogg" loop></audio>

    <script>
        const envelope = document.getElementById('envelope');
        const envelopeImg = document.getElementById('envelope-img');
        const actionText = document.getElementById('action-text');
        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('overlay');

        let isOpened = false;

        function openLetter() {
            if (isOpened) return;
            isOpened = true;

            // Thêm hiệu ứng click nhẹ
            envelope.classList.add('opening');

            setTimeout(() => {
                envelope.classList.remove('opening');
                envelope.classList.add('open');

                // Thay đổi hình ảnh sang phong bì mở
                envelopeImg.src = 'asset/Webp/letter_open.webp';
                actionText.textContent = 'Đang mở thư...';

                // Phát nhạc nền (vì người dùng đã click nên trình duyệt sẽ cho phép phát nhạc)
                audio.play().then(() => {
                    // Lưu trạng thái âm thanh để trang tiếp theo biết âm thanh đang phát
                    localStorage.setItem('audioPlaying', 'true');
                    localStorage.setItem('audioCurrentTime', audio.currentTime.toString());
                }).catch(err => {
                    console.log("Audio play failed/blocked:", err);
                });

                // Chờ hiệu ứng chuyển động hoàn tất rồi kích hoạt chuyển trang
                setTimeout(() => {
                    // Kích hoạt overlay chuyển trang mượt mà
                    overlay.classList.add('active');

                    // Chuyển hướng sang trang loading
                    setTimeout(() => {
                        window.location.href = 'loading.html';
                    }, 800); // Đợi overlay mờ dần
                }, 1200);

            }, 150);
        }

        // Đăng ký sự kiện click cho cả phong bì và dòng chữ
        envelope.addEventListener('click', openLetter);
        actionText.addEventListener('click', openLetter);
    </script>
</body>

</html>
