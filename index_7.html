<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Hướng dẫn sử dụng</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="transition-overlay active" id="overlay"></div>

    <!-- Decor lá góc trên trái -->
    <img src="asset/Webp/tgbskxkarv31g33wexxi.webp" alt="Lá cành góc trái" class="decor-leaf-top-left-p7">
    <!-- Decor lá góc dưới phải -->
    <img src="asset/Webp/ujztces8a1tpifatlchi.webp" alt="Lá cành góc dưới phải" class="decor-leaf-bottom-right-p7">

    <div class="page7-layout-container">

        <!-- Header: Logo thư mời -->
        <div class="header-decor">
            <img src="asset/Webp/thumoi_vector.webp" alt="Thư mời Lễ Tốt Nghiệp" class="thumoi-vector">
        </div>

        <h1 class="main-title-page7">Hướng dẫn sử dụng</h1>
        <h2 class="subtitle-page7">Liên hệ</h2>

        <!-- Bố cục 2 cột: liên hệ trái + iPhone phải -->
        <div class="contact-body-row">

            <!-- Cột trái: thông tin liên hệ -->
            <div class="contact-section">
                <p class="contact-lead">Đường dây nóng:</p>

                <!-- Thẻ liên hệ chính -->
                <div class="contact-card">
                    <div class="contact-name">Anh Long</div>

                    <!-- SĐT 1: Điện thoại – Copy khi nhấn -->
                    <div class="contact-row" id="phone1-row" onclick="copyPhone('0778554647', 'toast1')"
                        title="Nhấn để sao chép">
                        <span class="contact-icon">
                            <!-- Icon điện thoại SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c3d2e"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.54 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.92a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                            </svg>
                        </span>
                        <span class="contact-number">0778554647</span>
                        <span class="copy-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </span>
                        <span class="toast-inline" id="toast1">✓ Đã sao chép!</span>
                    </div>

                    <!-- SĐT 2: Zalo – Copy khi nhấn -->
                    <div class="contact-row" id="phone2-row" onclick="copyPhone('0778554647', 'toast2')"
                        title="Nhấn để sao chép">
                        <span class="contact-icon">
                            <!-- Icon Zalo SVG (logo chính thức dạng chữ Z bo tròn) -->
                            <svg width="20" height="20" viewBox="0 0 50 50"
                                xmlns="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg">
                                <rect width="50" height="50" rx="12" fill="#0068FF" />
                                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
                                    font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900"
                                    fill="#ffffff">Z</text>
                            </svg>
                        </span>
                        <span class="contact-number">0778554647</span>
                        <span class="copy-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </span>
                        <span class="toast-inline" id="toast2">✓ Đã sao chép!</span>
                    </div>

                    <!-- Link Facebook -->
                    <div class="contact-row contact-row-fb" id="fb-row">
                        <span class="contact-icon">
                            <!-- Icon Facebook SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#5c3d2e"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                            </svg>
                        </span>
                        <span class="contact-fb-name">Đặng Văn Long</span>
                    </div>
                </div>



            </div>

            <!-- Cột phải: ảnh iPhone mockup -->
            <div class="contact-iphone-col">
                <img src="asset/Webp/iphone.svg" alt="iPhone mockup" class="contact-iphone-img">
            </div>

        </div><!-- end .contact-body-row -->

        <!-- Nhóm nút điều hướng -->
        <div class="button-group-page7">
            <button class="btn-page7 btn-back" id="back-btn-7">Quay lại</button>
            <button class="btn-page7 btn-next" id="next-btn-7">Tiếp tục</button>
        </div>

    </div>

    <!-- Nhạc nền chính tiếp tục phát từ trang trước -->
    <audio id="bg-audio" src="asset/Music/Và-Thế-Giới-Đã-Mất-Đi-Một-Người-Cô-Đơn.ogg" loop></audio>

    <script>
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('bg-audio');
        const backBtn = document.getElementById('back-btn-7');
        const nextBtn = document.getElementById('next-btn-7');

        window.addEventListener('DOMContentLoaded', () => {
            // Tắt overlay mờ khi vào trang
            setTimeout(() => { overlay.classList.remove('active'); }, 100);

            // Tiếp tục phát nhạc từ trang trước
            const savedTime = localStorage.getItem('audioCurrentTime');
            const audioPlaying = localStorage.getItem('audioPlaying');

            if (savedTime) {
                audio.currentTime = parseFloat(savedTime);
            }

            if (audioPlaying === 'true') {
                audio.play().catch(() => {
                    document.body.addEventListener('click', () => { audio.play(); }, { once: true });
                });
            }

            // Đồng bộ thời gian nhạc liên tục
            const timeUpdater = setInterval(() => {
                if (!audio.paused) {
                    localStorage.setItem('audioCurrentTime', audio.currentTime.toString());
                }
            }, 1000);

            // Nút quay lại trang index_4
            backBtn.addEventListener('click', () => {
                localStorage.setItem('audioCurrentTime', audio.currentTime.toString());
                overlay.classList.add('active');
                setTimeout(() => {
                    clearInterval(timeUpdater);
                    window.location.href = 'index_4.html';
                }, 800);
            });

            // Nút tiếp tục sang trang cuối (finale)
            nextBtn.addEventListener('click', () => {
                localStorage.setItem('audioCurrentTime', audio.currentTime.toString());
                localStorage.setItem('audioPlaying', 'false'); // dừng nhạc chính, trang finale dùng outro
                overlay.classList.add('active');
                setTimeout(() => {
                    clearInterval(timeUpdater);
                    audio.pause();
                    window.location.href = 'index_final.html';
                }, 800);
            });
        });

        // Hàm copy SĐT vào clipboard và hiển thị toast
        function copyPhone(number, toastId) {
            navigator.clipboard.writeText(number).then(() => {
                const toast = document.getElementById(toastId);
                toast.classList.add('visible');
                setTimeout(() => { toast.classList.remove('visible'); }, 2000);
            }).catch(() => {
                // Fallback cho browser cũ
                const el = document.createElement('textarea');
                el.value = number;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                const toast = document.getElementById(toastId);
                toast.classList.add('visible');
                setTimeout(() => { toast.classList.remove('visible'); }, 2000);
            });
        }
    </script>
</body>

</html>
