<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập thông tin</title>
    <link rel="icon" type="image/webp" href="asset/Webp/thumoi_vector.webp">
    <!-- Nhúng CSS phong cách cổ điển -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Lớp phủ chuyển trang mượt mà -->
    <div class="transition-overlay active" id="overlay"></div>

    <!-- Tiêu đề góc trên bên trái -->
    <img src="asset/Webp/thumoi_vector.webp" alt="Thư mời Lễ Tốt Nghiệp" class="form-title-decor">

    <!-- Con tem góc trên bên phải -->
    <img src="asset/Webp/sv428pz4cgnzkmfv9jfn.webp" alt="Postage Stamp" class="form-stamp-decor">

    <!-- Hoa góc dưới bên trái -->
    <img src="asset/Webp/j8ejkadimxlopurzaex8.webp" alt="Dried Flower Left" class="form-flower-left-decor">

    <!-- Hoa góc dưới bên phải -->
    <img src="asset/Webp/ssnbubz8s1aeicahsfea.png" alt="Dried Flower Right" class="form-flower-right-decor">

    <!-- Vùng nhập thông tin -->
    <div class="form-wrapper">
        <h2 class="form-heading">Mời quý vị nhập thông tin</h2>

        <form class="form-content" id="info-form">
            <div class="input-group">
                <input type="text" id="fullname" placeholder="Họ & tên" required>
            </div>

            <div class="input-group">
                <input type="text" id="nickname" placeholder="Biệt danh" required>
            </div>

            <div class="input-group">
                <!-- Ràng buộc HTML: Phải nhập đúng 10 chữ số bắt đầu bằng số 0 -->
                <input type="tel" id="phone" placeholder="Số điện thoại " pattern="0[0-9]{9}"
                    title="Số điện thoại phải gồm đúng 10 chữ số và bắt đầu bằng số 0" required>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Tiếp tục</button>

            <div class="video-container" style="margin-top: 15px;">
                <video class="khabanh-video" autoplay loop muted playsinline
                    style="width: 120px; height: 170px; border-radius: 12px;">
                    <source src="asset/Video/khabanh_video.webm" type="video/webm">
                </video>
                <div class="video-overlay"></div>
            </div>
        </form>
    </div>

    <!-- Nhạc nền chạy ngầm -->
    <audio id="bg-audio" src="asset/Music/Và-Thế-Giới-Đã-Mất-Đi-Một-Người-Cô-Đơn.ogg" loop></audio>

    <!-- Nhúng các module Firebase từ CDN để chạy trực tiếp trên trình duyệt -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // Cấu hình Firebase thực tế của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyBF9lN3JxFqikHwJlMa9WqFPLJvM2Vr5uY",
            authDomain: "graduation-a4709.firebaseapp.com",
            databaseURL: "https://graduation-a4709-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "graduation-a4709",
            storageBucket: "graduation-a4709.firebasestorage.app",
            messagingSenderId: "329769709703",
            appId: "1:329769709703:web:0cbfd9e5459b9937d54822",
            measurementId: "G-NG7RJ3BDLB"
        };

        // Khởi tạo các dịch vụ Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Logic xử lý audio và chuyển trang
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('bg-audio');

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 100);

            const audioPlaying = localStorage.getItem('audioPlaying');
            const savedTime = localStorage.getItem('audioCurrentTime');

            if (audioPlaying === 'true') {
                if (savedTime) audio.currentTime = parseFloat(savedTime);
                audio.play().catch(err => {
                    document.body.addEventListener('click', () => { audio.play(); }, { once: true });
                });
            } else {
                audio.play().then(() => {
                    localStorage.setItem('audioPlaying', 'true');
                }).catch(err => console.log("Autoplay blocked:", err));
            }

            setInterval(() => {
                if (!audio.paused) {
                    localStorage.setItem('audioCurrentTime', audio.currentTime.toString());
                }
            }, 1000);
        });

        // Xử lý sự kiện submit form và đẩy dữ liệu lên Firebase Cloud
        const form = document.getElementById('info-form');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Lấy giá trị và loại bỏ khoảng trắng thừa ở hai đầu đầu vào
            const fullname = document.getElementById('fullname').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // CHỈ KIỂM TRA ĐIỀU KIỆN SỐ ĐIỆN THOẠI (10 chữ số bắt đầu bằng số 0)
            const phoneRegex = /^0[0-9]{9}$/;
            if (!phoneRegex.test(phone)) {
                alert("Số điện thoại không hợp lệ! Vui lòng nhập đúng 10 chữ số bắt đầu bằng số 0.");
                return;
            }

            // Khóa nút bấm để tránh double-click gửi trùng dữ liệu
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Đang lưu...";

            // Lưu tạm vào localStorage để trang sau sử dụng nếu cần
            localStorage.setItem('fullname', fullname);
            localStorage.setItem('nickname', nickname);
            localStorage.setItem('phone', phone);

            try {
                // Đẩy dữ liệu lên Firebase
                const userListRef = ref(database, 'users_info');
                const newUserRef = push(userListRef);

                await set(newUserRef, {
                    fullname: fullname,
                    nickname: nickname,
                    phone: phone,
                    createdAt: new Date().toISOString()
                });

                // Chuyển trang mượt mà
                overlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = 'index_2.html';
                }, 800);

            } catch (error) {
                console.error("Lỗi khi lưu dữ liệu: ", error);
                alert("Có lỗi xảy ra khi gửi thông tin. Vui lòng thử lại!");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Tiếp tục";
            }
        });
    </script>
</body>

</html>
